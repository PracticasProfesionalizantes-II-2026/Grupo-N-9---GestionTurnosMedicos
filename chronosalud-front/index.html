<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión · ChronoSalud</title>
    <link rel="stylesheet" href="css/estilos.css" />
  </head>
  <body class="acceso">
    <main class="acceso__caja">
      <div class="acceso__marca">
        <span class="marca__icono">✚</span>
        <span class="marca__texto">Chrono<strong>Salud</strong></span>
      </div>
      <p class="acceso__subtitulo">Gestión de turnos médicos</p>

      <div id="mensaje"></div>

      <form id="form-login" novalidate>
        <div class="campo">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required />
        </div>
        <div class="campo">
          <label for="contrasena">Contraseña</label>
          <input
            type="password"
            id="contrasena"
            name="contrasena"
            autocomplete="current-password"
            required
          />
        </div>
        <button type="submit" class="boton ancho-total" id="btn-ingresar">Ingresar</button>
      </form>

      <p class="acceso__pie">¿No tenés cuenta? <a href="registro.html">Registrate</a></p>
    </main>

    <script type="module" src="js/paginas/login.js"></script>
  </body>
</html>
