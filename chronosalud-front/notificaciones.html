<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notificaciones · ChronoSalud</title>
    <link rel="stylesheet" href="css/estilos.css" />
  </head>
  <body>
    <div id="encabezado"></div>

    <main class="contenido">
      <div class="titulo-pagina">
        <div>
          <h1>Notificaciones</h1>
          <p>Avisos del sistema para tu cuenta</p>
        </div>
      </div>

      <div id="mensaje"></div>

      <section class="tarjeta">
        <form id="form-filtros">
          <div class="fila-campos">
            <div class="campo">
              <label for="filtro-leida">Estado</label>
              <select id="filtro-leida" name="leida">
                <option value="">Todas</option>
                <option value="false">No leídas</option>
                <option value="true">Leídas</option>
              </select>
            </div>
            <div class="campo">
              <label for="filtro-tipo">Tipo</label>
              <input type="search" id="filtro-tipo" name="tipo" placeholder="recordatorio…" />
            </div>
            <div class="campo">
              <label>&nbsp;</label>
              <div class="acciones">
                <button type="submit" class="boton">Filtrar</button>
                <button type="button" class="boton boton--secundario" id="btn-limpiar">
                  Limpiar
                </button>
              </div>
            </div>
          </div>
        </form>
      </section>

      <section class="tarjeta">
        <h2 class="tarjeta__titulo">
          Bandeja <span class="texto-suave" id="resumen"></span>
        </h2>
        <div class="tabla-scroll">
          <table>
            <thead>
              <tr>
                <th>Fecha</th>
                <th>Tipo</th>
                <th>Mensaje</th>
                <th>Estado</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="tabla-notificaciones">
              <tr><td colspan="5" class="tabla__vacia">Cargando…</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <script type="module" src="js/paginas/notificaciones.js"></script>
  </body>
</html>
