<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crear cuenta · ChronoSalud</title>
    <link rel="stylesheet" href="css/estilos.css" />
  </head>
  <body class="acceso">
    <main class="acceso__caja">
      <div class="acceso__marca">
        <span class="marca__icono">✚</span>
        <span class="marca__texto">Chrono<strong>Salud</strong></span>
      </div>
      <p class="acceso__subtitulo">Crear una cuenta</p>

      <div id="mensaje"></div>

      <form id="form-registro" novalidate>
        <div class="fila-campos">
          <div class="campo">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" required />
          </div>
          <div class="campo">
            <label for="apellido">Apellido</label>
            <input type="text" id="apellido" name="apellido" required />
          </div>
        </div>
        <div class="campo">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required />
        </div>
        <div class="campo">
          <label for="telefono">Teléfono (opcional)</label>
          <input type="tel" id="telefono" name="telefono" />
        </div>
        <div class="campo">
          <label for="contrasena">Contraseña</label>
          <input
            type="password"
            id="contrasena"
            name="contrasena"
            autocomplete="new-password"
            minlength="8"
            required
          />
          <span class="texto-suave" style="font-size: 13px">Mínimo 8 caracteres.</span>
        </div>
        <div class="campo">
          <label for="rol">Rol</label>
          <select id="rol" name="rol" required>
            <option value="paciente">Paciente</option>
            <option value="doctor">Doctor</option>
            <option value="administrador">Administrador</option>
          </select>
          <span class="texto-suave" style="font-size: 13px" id="ayuda-rol"></span>
        </div>
        <button type="submit" class="boton ancho-total" id="btn-crear">Crear cuenta</button>
      </form>

      <p class="acceso__pie">¿Ya tenés cuenta? <a href="index.html">Iniciar sesión</a></p>
    </main>

    <script type="module" src="js/paginas/registro.js"></script>
  </body>
</html>
